name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: review-router-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    uses: 777genius/review-router/.github/workflows/reviewrouter-reusable.yml@41d84b36d5f593c33207f0b2375a000e2c4ede6f
    with:
      runtime_ref: 41d84b36d5f593c33207f0b2375a000e2c4ede6f
      runtime_config_mode: oidc
      static_runtime_env_json: >-
        {"REVIEW_AUTH_MODE":"codex-oauth","MIN_CONFIDENCE":"0.6","CONSENSUS_REQUIRED_FOR_CRITICAL":"false","FAIL_ON_MAJOR":"true","CODEX_MODEL":"${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.6-sol' }}","CODEX_REASONING_EFFORT":"xhigh"}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      review_drafts: ${{ vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true' }}
      review_timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
      max_changed_lines: ${{ vars.REVIEW_ROUTER_MAX_CHANGED_LINES || '250000' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEWROUTER_LEDGER_KEY }}

  required-check:
    name: ReviewRouter
    needs: review
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify review result
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: test "$REVIEW_RESULT" = success

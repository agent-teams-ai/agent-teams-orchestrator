name: TEST Orchestrator native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-orchestrator-981d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: bash scripts/ci/check-frozen-peer-enforcement.sh
      - run: pnpm install --frozen-lockfile --config.engine-strict=true --strict-peer-dependencies && pnpm peers check
      - name: Prepare isolated PostgreSQL conformance binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "TEST_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          echo "RUN_CONTEXT_OBSERVATION_PG=1" >> "$GITHUB_ENV"
      - run: pnpm check
      - name: Run advisory quality diagnostics
        continue-on-error: true
        run: pnpm quality:diagnostic
      - if: github.event_name == 'pull_request'
        run: pnpm docs:impact -- --base "${{ github.event.pull_request.base.sha }}" --strict

  node-24-compatibility:
    name: Node.js 24 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: bash scripts/ci/check-frozen-peer-enforcement.sh
      - run: pnpm install --frozen-lockfile --config.engine-strict=true --strict-peer-dependencies && pnpm peers check
      - name: Prepare isolated PostgreSQL conformance binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "TEST_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          echo "RUN_CONTEXT_OBSERVATION_PG=1" >> "$GITHUB_ENV"
      - run: pnpm check

  local-host-control-cross-platform:
    name: Local Host Control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=true --strict-peer-dependencies && pnpm peers check
      - name: Characterize documentation authoring
        run: pnpm docs:test
      - run: pnpm --filter @agent-teams/local-host-control run check
      - run: pnpm architecture:scaffolding:check

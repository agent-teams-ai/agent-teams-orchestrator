name: TEST Orchestrator focused quality diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-orchestrator-quality-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-quality-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: bash scripts/ci/check-frozen-peer-enforcement.sh
      - run: pnpm install --frozen-lockfile --config.engine-strict=true --strict-peer-dependencies && pnpm peers check
      - name: Run original complete failing fixture with untruncated TAP diagnostics
        run: >-
          node --test --test-reporter=tap
          --test-name-pattern="^published coverage accepts the real consumer profile$"
          scripts/architecture/quality-source-coverage.test.mjs

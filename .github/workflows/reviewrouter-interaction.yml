name: ReviewRouter Interaction

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: review-router-interaction-${{ github.event.pull_request.number || github.event.issue.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  interaction:
    if: ${{ github.event_name == 'workflow_dispatch' || ((github.event_name != 'issue_comment' || github.event.issue.pull_request) && github.event.comment.user.type != 'Bot') }}
    uses: 777genius/review-router/.github/workflows/reviewrouter-interaction-reusable.yml@41d84b36d5f593c33207f0b2375a000e2c4ede6f
    with:
      runtime_ref: 41d84b36d5f593c33207f0b2375a000e2c4ede6f
      runtime_config_mode: oidc
      review_workflow_file: reviewrouter.yml
      discussion_mode: ${{ vars.REVIEW_ROUTER_DISCUSSION_MODE || 'off' }}

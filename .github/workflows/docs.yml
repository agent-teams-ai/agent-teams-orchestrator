name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - ".agents/skills/**"
      - ".cspell/**"
      - ".cspell.json"
      - ".markdownlint-cli2.mjs"
      - ".node-version"
      - ".vale/**"
      - ".vale.ini"
      - "AGENTS.md"
      - "architecture/likec4/**"
      - "README.md"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/docs/**"
      - "scripts/architecture/validate-architecture-model*"
      - "scripts/skills/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - ".agents/skills/**"
      - ".cspell/**"
      - ".cspell.json"
      - ".markdownlint-cli2.mjs"
      - ".node-version"
      - ".vale/**"
      - ".vale.ini"
      - "AGENTS.md"
      - "architecture/likec4/**"
      - "README.md"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/docs/**"
      - "scripts/architecture/validate-architecture-model*"
      - "scripts/skills/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm docs:check

      - name: Check documentation impact
        if: github.event_name == 'pull_request'
        run: pnpm docs:impact -- --base "${{ github.event.pull_request.base.sha }}" --strict

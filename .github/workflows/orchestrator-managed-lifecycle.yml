name: Orchestrator retained managed lifecycle

on:
  push:
    branches: [test/iam-managed-e2e-20261127]

permissions:
  contents: read

concurrency:
  group: orchestrator-retained-managed-lifecycle
  cancel-in-progress: false

jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Select isolated lifecycle directories
        shell: bash
        run: |
          printf 'E2E_ROOT=%s/iam-managed-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'E2E_CONSUMER=%s/consumer\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'E2E_CANDIDATE=%s/candidate\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3dccf2c53bf11f3939a19734a58f5e64d96673d0
          fetch-depth: 0
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c01efb6813f0c048497caeefbb8235cead480cb2
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.11.1
          check-latest: false
      - name: Retain physical Node 26 path
        shell: bash
        run: printf 'AGENT_TEAMS_DOCS_UPGRADE_NODE26_EXECUTABLE=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          check-latest: false
      - name: Retain physical Node 24 path
        shell: bash
        run: printf 'AGENT_TEAMS_DOCS_UPGRADE_NODE24_EXECUTABLE=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Qualify real retained controller lifecycle
        shell: bash
        env:
          CENTRAL_READ_TOKEN: ${{ github.token }}
        run: bash harness/.github/scripts/orchestrator-managed-lifecycle.sh
      - name: Reconcile the separately owned Host candidate
        shell: bash
        run: |
          "$AGENT_TEAMS_DOCS_UPGRADE_NODE26_EXECUTABLE" harness/.github/scripts/orchestrator-host-integration.mjs \
            --candidate "$E2E_CANDIDATE" --target "$E2E_CONSUMER" \
            --evidence "$E2E_EVIDENCE" --controller "$E2E_CONTROLLER" \
            --node24 "$AGENT_TEAMS_DOCS_UPGRADE_NODE24_EXECUTABLE" \
            --node26 "$AGENT_TEAMS_DOCS_UPGRADE_NODE26_EXECUTABLE" \
            --corepack "$AGENT_TEAMS_DOCS_UPGRADE_COREPACK_ENTRYPOINT" \
            --export "$E2E_ROOT/host-export"
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orchestrator-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_ROOT }}/evidence
            ${{ env.E2E_ROOT }}/host-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

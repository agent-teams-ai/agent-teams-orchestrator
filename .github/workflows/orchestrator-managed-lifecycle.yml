name: Orchestrator source preparation prerequisite

on:
  push:
    branches: [test/iam-managed-e2e-20261127]

permissions:
  contents: read

concurrency:
  group: orchestrator-source-admission-prerequisite
  cancel-in-progress: false

jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Select isolated lifecycle directories
        shell: bash
        run: |
          printf 'E2E_ROOT=%s/iam-managed-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'E2E_CONSUMER=%s/consumer\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'E2E_CANDIDATE=%s/candidate\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'E2E_SELECTED_TARGET_LOCKFILE=%s/harness/.github/inputs/selected-target-lock.yaml\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'E2E_SELECTED_TARGET_LOCK_SHA256=%s\n' 'sha256:a8080107bb13e2170fee5e3f25f30ff5df835cd5e540e66f177a0ef0e57c264b' >> "$GITHUB_ENV"
          printf 'E2E_HARNESS_INPUT_BINDING=%s/harness/.github/inputs/harness-input-binding.json\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'E2E_TARGET_RUNTIME_CLOSURE=%s/harness/.github/inputs/target-runtime-closure.json\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ccc73331a2ca4f498a51fb6ee0f50b5d0cecff67
          fetch-depth: 0
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c01efb6813f0c048497caeefbb8235cead480cb2
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.12.1
          check-latest: false
      - name: Retain physical Node 26 path
        shell: bash
        run: printf 'AGENT_TEAMS_DOCS_UPGRADE_NODE26_EXECUTABLE=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
          check-latest: false
      - name: Retain physical Node 24 path
        shell: bash
        run: printf 'AGENT_TEAMS_DOCS_UPGRADE_NODE24_EXECUTABLE=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Observe actual source preparation only
        shell: bash
        env:
          CENTRAL_READ_TOKEN: ${{ github.token }}
        run: bash harness/.github/scripts/orchestrator-managed-source-admission.sh
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orchestrator-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_ROOT }}/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

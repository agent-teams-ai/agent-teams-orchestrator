schemaVersion: 1

qualificationFramework:
  id: deployment-qualification
  qualification: blocked
  blockedBy: [OD-039]
  qualificationEvidence:
    decisionRefs: []
    conformanceRefs: []

profiles:
  - id: managed-saas
    description: Agent Teams-managed Server Host with managed product authority and infrastructure.
    releaseScope: v1-target
    qualification: blocked
    blockedBy: [OD-003, OD-012]
    productAuthorityAdapter: managed-platform
    commercialAuthorityAdapter: optional-managed-platform
    requiredCapabilities: [server-runtime-execution]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: standalone-self-hosted
    description: Customer-operated Server Host with standalone authority and customer infrastructure.
    releaseScope: v1-target
    qualification: blocked
    blockedBy: [OD-003, OD-012]
    productAuthorityAdapter: standalone
    commercialAuthorityAdapter: none
    requiredCapabilities: [server-runtime-execution]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: connected-self-hosted
    description: Future customer-operated Host using explicitly selected managed capabilities.
    releaseScope: future
    qualification: deferred
    blockedBy: [OD-003, OD-012]
    productAuthorityAdapter: standalone
    commercialAuthorityAdapter: optional-managed-platform
    requiredCapabilities: [server-runtime-execution]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: fully-local
    description: Future user-device Host with local authority, persistence, and supervised components.
    releaseScope: future
    qualification: deferred
    blockedBy: [OD-001, OD-003, OD-009, OD-021, OD-035]
    productAuthorityAdapter: local-standalone
    commercialAuthorityAdapter: none
    requiredCapabilities: [local-host-runtime-execution]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []

capabilities:
  - id: server-runtime-execution
    description: Server Orchestrator Host controls qualified server-side AR capacity.
    qualification: blocked
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted]
    blockedBy: [OD-004]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: local-host-runtime-execution
    description: Fully Local Orchestrator Host controls qualified AR capacity on the same user device.
    qualification: blocked
    profiles: [fully-local]
    blockedBy: [OD-004, OD-021, OD-035]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: local-device-execution
    description: Server Orchestrator controls enrolled AR capacity on a user or customer device.
    qualification: blocked
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted]
    blockedBy: [OD-038]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []
  - id: managed-commercial-entitlements
    description: Managed or connected Host consumes independently qualified commercial capability evidence.
    qualification: blocked
    profiles: [managed-saas, connected-self-hosted]
    blockedBy: [OD-037]
    qualificationEvidence:
      decisionRefs: []
      conformanceRefs: []

metricAttributes:
  - id: deployment.profile
    cardinality: low
    maxDistinct: 4
  - id: command.kind
    cardinality: bounded
    maxDistinct: 32
  - id: operation.outcome
    cardinality: bounded
    maxDistinct: 8
  - id: feed.kind
    cardinality: bounded
    maxDistinct: 16
  - id: recovery.reason
    cardinality: bounded
    maxDistinct: 16

prohibitedMetricAttributes:
  - tenant.id
  - project.id
  - team.id
  - run.id
  - agent.id
  - user.id
  - runtime.session.id
  - operation.id
  - trace.id
  - span.id
  - url.full
  - url.path
  - workspace.path

indicators:
  - id: orchestrator.command-acceptance-latency
    owner: platform/control-api
    criticalUserJourney: A caller submits a valid command and receives a durable acceptance outcome.
    specification: Distribution from authenticated command receipt to durable acceptance or rejection.
    status: candidate
    measure: histogram
    unit: milliseconds
    source: control-api.command-receipt
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile
      - command.kind

  - id: orchestrator.dispatch-age
    owner: run-orchestration
    criticalUserJourney: Accepted orchestration work reaches the responsible external capability.
    specification: Distribution from durable dispatch intent creation to acknowledged dispatch or reconciliation.
    status: candidate
    measure: histogram
    unit: milliseconds
    source: dispatch.intent-lifecycle
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile
      - command.kind

  - id: orchestrator.observation-freshness
    owner: platform/eventing
    criticalUserJourney: A subscribed caller observes durable orchestration progress without an unexplained stale view.
    specification: Age of the newest durable feed position available to an authorized consumer.
    status: candidate
    measure: gauge
    unit: milliseconds
    source: feed.delivery-watermark
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile
      - feed.kind

  - id: orchestrator.recovery-duration
    owner: run-orchestration
    criticalUserJourney: A Run target returns to a known state after runtime continuity is lost.
    specification: Distribution from Run-target recovery detection to a terminal recovered, failed, or operator-required outcome.
    status: candidate
    measure: histogram
    unit: milliseconds
    source: run-runtime-target.recovery-lifecycle
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile
      - recovery.reason
      - operation.outcome

  - id: orchestrator.scope-disposition-duration
    owner: orchestration-scope
    criticalUserJourney: Project retirement reaches a truthful disposition outcome across all required owners.
    specification: Distribution from durable Project disposition acceptance to satisfied, policy-retained, or reconciliation-required outcome.
    status: candidate
    measure: histogram
    unit: milliseconds
    source: scope.disposition-lifecycle
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile
      - recovery.reason
      - operation.outcome

invariants:
  - id: orchestrator.accepted-command-durability
    owner: platform/control-api
    statement: A durably accepted command is never silently lost after acknowledgement.
    verification:
      - contract-conformance
      - fault-injection
      - persistence-conformance

  - id: orchestrator.single-business-effect
    owner: architecture/reliability
    statement: Retries and duplicate delivery never create a duplicate business effect.
    verification:
      - architecture-conformance
      - contract-conformance
      - property-test

  - id: orchestrator.tenant-isolation
    owner: architecture/security
    statement: A command or observation never crosses an unauthorized tenant boundary.
    verification:
      - contract-conformance
      - security-fixture

  - id: orchestrator.no-late-runtime-dispatch
    owner: integration/runtime
    statement: If pre-materialization prevention commits before the AR dispatch claim, the matching delayed operation never reaches the provider.
    verification:
      - contract-conformance
      - property-test
      - fault-injection

  - id: orchestrator.state-outbox-atomicity
    owner: platform/persistence
    statement: Authoritative state and its required durable dispatch intent commit atomically.
    verification:
      - fault-injection
      - persistence-conformance

resourceBudgets:
  - id: orchestrator.event-loop-delay
    owner: platform/local-host
    concern: Host responsiveness must remain bounded while synchronous local persistence performs work.
    status: candidate
    measure: histogram
    unit: milliseconds
    source: host.event-loop
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile

  - id: orchestrator.command-lane-saturation
    owner: architecture/reliability
    concern: Command lanes must reject or shed work predictably before memory becomes unbounded.
    status: candidate
    measure: gauge
    unit: ratio
    source: command-lane.capacity
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile

  - id: orchestrator.local-disk-headroom
    owner: platform/local-host
    concern: Local durable state must stop safely before storage exhaustion corrupts active work.
    status: candidate
    measure: gauge
    unit: bytes
    source: local-storage.headroom
    profiles: [fully-local]
    allowedAttributes:
      - deployment.profile

  - id: orchestrator.metric-cardinality
    owner: platform/observability
    concern: Metric series growth must stay bounded and preserve reliable outcome dimensions.
    status: candidate
    measure: gauge
    unit: count
    source: telemetry.metric-cardinality
    profiles: [managed-saas, standalone-self-hosted, connected-self-hosted, fully-local]
    allowedAttributes:
      - deployment.profile

schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint-fast
    script: lint:fast:files
    extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts]
  - id: lint-type-aware
    script: lint:type-aware:files
    extensions: [.ts, .tsx, .mts, .cts]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: docs
    script: docs:check
    extensions: [.md]
    passPaths: false
  - id: architecture
    script: architecture:check
    extensions: [.json, .yaml, .yml, .c4]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - .oxlintrc.advisory.json
  - .oxlintrc.json
  - architecture/foundation
  - nx.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig.architecture.json
  - tsconfig.json

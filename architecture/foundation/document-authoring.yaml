schemaVersion: 2
projectId: agent-teams-orchestrator

catalog:
  metadataSchemaPath: docs/metadata.schema.json

  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1

  collections:
    - kind: markdown-tree
      root: docs

    - kind: frontmatter-readme
      roots:
        - apps
        - packages
        - tooling

  excludedPrefixes:
    - scripts/docs/fixtures

authoring:
  mode: create-only

  artifactTypes:
    - type: adr
      initialStatus: proposed
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: adr-four-digits
      placement:
        kind: collection
        directory: docs/decisions
        filename: numeric-id-slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/adr.md
      heading:
        kind: id-colon-title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/decisions/README.md

    - type: open-decision
      initialStatus: open
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: open-decision-three-digits
      placement:
        kind: collection
        directory: docs/open-decisions
        filename: id-slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/open-decision.md
      heading:
        kind: id-colon-title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/open-decisions/README.md

    - type: bounded-context
      initialStatus: proposed
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - domain
            - contexts
          minSuffixSegments: 1
          maxSuffixSegments: 1
      placement:
        kind: qualified-leaf-index
        root: docs/domain/contexts
        requiredBasename: README.md
      template:
        kind: fenced-markdown-body
        path: docs/templates/bounded-context.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/domain/contexts/README.md

    - type: contract
      initialStatus: proposed
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - contract
          minSuffixSegments: 2
          maxSuffixSegments: 16
      placement:
        kind: collection
        directory: docs/contracts
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/contract.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/contracts/README.md

    - type: feature
      initialStatus: proposed
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - feature
          minSuffixSegments: 2
          maxSuffixSegments: 16
      placement:
        kind: explicit
        allowedRoots:
          - apps
          - packages
          - tooling
        requiredSegmentsInOrder:
          - src
          - features
        requiredBasename: README.md
        minimumSegmentsBeforeRequired: 1
        minimumSegmentsAfterRequired: 1
      template:
        kind: fenced-markdown-body
        path: docs/templates/feature.md
      heading:
        kind: title
      reachability:
        kind: manual-colocated-index
        pathPrefix: before-required-segments
        indexBasename: README.md

    - type: runbook
      initialStatus: active
      allowedOwnerIds:
        - access-control
        - agent-attention
        - agent-communication
        - agent-context
        - agent-organization
        - apps
        - apps/desktop-sidecar
        - approval-management
        - architecture
        - architecture/composition
        - architecture/contracts
        - architecture/domain
        - architecture/governance
        - architecture/quality
        - architecture/reliability
        - architecture/security
        - architecture/tooling
        - clients/sdk
        - consumption-governance
        - engineering/tooling
        - human-notification
        - identity-registry
        - integration/runtime
        - migration/desktop
        - operations
        - orchestration-scope
        - platform/control-api
        - platform/eventing
        - platform/local-host
        - platform/observability
        - platform/persistence
        - policy-risk
        - run-orchestration
        - team-topology
        - usage-accounting
        - usage-capability
        - usage-metering
        - work-coordination
        - workspace-registry
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - runbook
          minSuffixSegments: 2
          maxSuffixSegments: 16
      placement:
        kind: collection
        directory: docs/operations
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/runbook.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/operations/README.md

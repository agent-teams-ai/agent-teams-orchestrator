schemaVersion: 3
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
packageRoots:
  - packages/platform/local-host-control
  - tooling/architecture-conformance
rootPackage: true
governedRoots:
  - packages/platform/local-host-control
  - scripts
  - tooling/architecture-conformance
  - tooling/architecture-conformance-fixtures/core-valid
  - tooling/architecture-conformance-fixtures/cycles
  - tooling/architecture-conformance-fixtures/invalid
  - tooling/architecture-conformance-fixtures/scaffolding/library-boundary-golden/src
  - tooling/architecture-conformance-fixtures/valid
boundaries:
  - id: tooling.orchestration-specs
    dependencyMode: development
    roots:
      - scripts/orchestration-specs
    entrypoints:
      - scripts/orchestration-specs/check-specs.mjs
      - scripts/orchestration-specs/generate-specs.mjs
    allow:
      boundaries: []
      packages:
        - "@xstate/graph"
        - ajv
        - fast-check
        - xstate
        - yaml
      builtins:
        - node:assert/strict
        - node:child_process
        - node:fs
        - node:path
        - node:test
        - node:url
      runtimeReferences: []
  - id: platform.local-host-control.public-api
    dependencyMode: runtime
    roots:
      - packages/platform/local-host-control/src/index.ts
    entrypoints:
      - packages/platform/local-host-control/src/index.ts
    packageExports:
      - "."
    allow:
      boundaries:
        - platform.local-host-control.host-discovery.api
      packages: []
      builtins: []
      runtimeReferences: []
  - id: platform.local-host-control.host-discovery.api
    roots:
      - packages/platform/local-host-control/src/features/host-discovery/index.ts
    entrypoints:
      - packages/platform/local-host-control/src/features/host-discovery/index.ts
    allow:
      boundaries:
        - platform.local-host-control.host-discovery.application
        - platform.local-host-control.host-discovery.model
        - platform.local-host-control.host-discovery.ports
      packages: []
      builtins: []
      runtimeReferences: []
  - id: platform.local-host-control.host-discovery.application
    roots:
      - packages/platform/local-host-control/src/features/host-discovery/application/discover-local-host.ts
      - packages/platform/local-host-control/src/features/host-discovery/application/host-discovery-validation.ts
    entrypoints:
      - packages/platform/local-host-control/src/features/host-discovery/application/discover-local-host.ts
    allow:
      boundaries:
        - platform.local-host-control.host-discovery.model
        - platform.local-host-control.host-discovery.ports
      packages: []
      builtins: []
      runtimeReferences: []
  - id: platform.local-host-control.host-discovery.model
    roots:
      - packages/platform/local-host-control/src/features/host-discovery/application/model
    entrypoints:
      - packages/platform/local-host-control/src/features/host-discovery/application/model/host-discovery.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: platform.local-host-control.host-discovery.ports
    roots:
      - packages/platform/local-host-control/src/features/host-discovery/application/ports
    entrypoints:
      - packages/platform/local-host-control/src/features/host-discovery/application/ports/host-discovery-source.ts
    allow:
      boundaries:
        - platform.local-host-control.host-discovery.model
      packages: []
      builtins: []
      runtimeReferences: []
  - id: test.local-host-control
    dependencyMode: development
    roots:
      - packages/platform/local-host-control/tests
    entrypoints: []
    allow:
      boundaries:
        - platform.local-host-control.public-api
        - platform.local-host-control.host-discovery.api
        - platform.local-host-control.host-discovery.application
        - platform.local-host-control.host-discovery.model
        - platform.local-host-control.host-discovery.ports
      packages:
        - "@agent-teams/local-host-control"
      builtins:
        - node:assert/strict
        - node:child_process
        - node:fs/promises
        - node:os
        - node:path

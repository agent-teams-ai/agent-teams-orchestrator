  typescript: 7.0.2
  unified: 11.0.5
  unist-util-visit: 5.1.0
  xstate: 5.32.5
  yaml: 2.9.0

catalogs:
  tooling-ts6:
    dependency-cruiser: 18.1.0
    typescript: 6.0.3

packageExtensions:
  "dependency-cruiser@18.1.0":
    peerDependencies:
      "typescript": ">=2.0.0 <7.0.0"

minimumReleaseAge: 0

overrides:
  "js-yaml": "5.2.2"
  "jsdom@29>undici": "7.29.0"
  "minimatch@10>brace-expansion": "5.0.12"
  "nx@23>brace-expansion": "5.0.12"
  "postcss@8>nanoid": "3.3.18"

allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  # Frozen native bindings are exercised by the spike; do not fetch a SWC fallback.
  "@swc/core": false
  esbuild: true
  nx: true
  # This optional postinstall only prints a version-scheme advisory.
  protobufjs: false
minimumReleaseAgeExclude:
  - "@agent-teams/repository-mutation@0.2.2"
  - "@agent-teams/document-authoring@0.3.2"
  - "@agent-teams/docs-protocol@0.6.2"
  - "@agent-teams/docs-protocol-agent-teams@0.3.2"
  - "@agent-teams/engineering-foundation@1.7.2"

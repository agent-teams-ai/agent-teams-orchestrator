  "@types/pg": 8.23.1
  pg: 8.23.1
  '@types/node': 26.6.5
  "@xstate/graph": 3.0.4
  ajv: 8.20.0
  ajv-formats: 3.0.1
  cspell: 10.0.1
  eslint-import-resolver-oxc: 0.15.0
  eslint-plugin-boundaries: 7.1.0
  embedded-postgres: 18.4.0-beta.17
  fast-check: 4.9.0
  github-slugger: 2.0.0
  jsdom: 29.1.1
  likec4: 1.59.2
  long: 5.3.2
  markdownlint-cli2: 0.23.1
  mdast-util-to-string: 4.0.0
  mermaid: 11.16.1
  nx: 23.1.1
  openworkflow: 0.11.0
  oxc-parser: 0.142.0
  oxc-resolver: 11.24.2
  oxlint: 1.83.0
  oxlint-tsgolint: 7.0.2001
  postgres: 3.4.9
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
